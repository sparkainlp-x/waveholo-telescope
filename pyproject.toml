[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveholo-telescope"
version = "0.2.0"
description = "Synthetic-only off-axis digital holography pipeline for a telescope-pupil model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [
  {name = "Jean-François Brisson"}
]
keywords = ["holography", "optics", "wavefront", "telescope", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/sparkainlp-x/waveholo-telescope"
Changelog = "https://github.com/sparkainlp-x/waveholo-telescope/blob/main/CHANGELOG.md"
Issues = "https://github.com/sparkainlp-x/waveholo-telescope/issues"

[project.scripts]
worldholo-benchmark = "waveholo_telescope.benchmark:main"
waveholo-benchmark = "waveholo_telescope.benchmark:main"

[tool.setuptools.package-data]
waveholo_telescope = ["configs/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["waveholo_telescope*"]

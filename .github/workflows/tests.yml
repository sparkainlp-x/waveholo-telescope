name: Research software tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: make test
      - run: python -m compileall -q src tests
      - run: |
          set +e
          make benchmark CONFIG=benchmarks/configs/telescope_smoke.yaml OUTPUT=/tmp/telescope-smoke
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/telescope-smoke/manifest.json').read_text())
          claims = json.loads(Path('/tmp/telescope-smoke/claims.json').read_text())
          assert manifest['status'] == 'COMPLETE'
          assert claims['claim_gate_status'] == 'fail'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: telescope-smoke-${{ github.run_id }}
          path: /tmp/telescope-smoke
          if-no-files-found: error

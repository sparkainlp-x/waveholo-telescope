name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.1 twine==7.0.0
          python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Validate exact release artifacts (not scientific acceptance)
        run: python tests/test_artifacts.py --dist dist --work-dir "$RUNNER_TEMP/waveholo-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: waveholo-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: waveholo-dist-${{ github.run_id }}
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: waveholo-telescope ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Synthetic-only release

            This release does not validate a physical telescope, camera, atmosphere, adaptive-optics system, or observatory deployment. All benchmark results are simulated ground-truth comparisons.

            ### Install
            ```bash
            python -m pip install waveholo-telescope
            ```

            ### Run benchmark
            ```bash
            waveholo-benchmark --config smoke --output results/smoke
            ```

            ### License
            AGPL-3.0-only.

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/waveholo-telescope
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: waveholo-dist-${{ github.run_id }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          verbose: true

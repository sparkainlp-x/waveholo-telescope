name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e .
      - name: Verify tag and package versions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          citation = re.search(r'^version:\s*(\S+)\s*$', Path('CITATION.cff').read_text(), re.M)
          package = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', Path('src/waveholo_telescope/__init__.py').read_text(), re.M)
          expected = f"v{version}"
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f"Tag {os.environ['RELEASE_TAG']} does not match package version {expected}")
          if not citation or citation.group(1) != version:
              raise SystemExit("CITATION.cff version does not match project metadata")
          if not package or package.group(1) != version:
              raise SystemExit("Python package version does not match project metadata")
          print(f"Release version verified: {version}")
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run smoke benchmark
        run: waveholo-benchmark --config smoke --output results/release-smoke
      - name: Validate benchmark
        run: |
          test -f results/release-smoke/raw_results.json
          test -f results/release-smoke/claims.json
          test -f results/release-smoke/checksums.sha256
          cd results/release-smoke
          sha256sum --check checksums.sha256
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: waveholo-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: waveholo-release-benchmark-${{ github.run_id }}
          path: results/release-smoke
          if-no-files-found: error

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: waveholo-dist-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: waveholo-release-benchmark-${{ github.run_id }}
          path: benchmark
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: waveholo-telescope ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            benchmark/*
          body: |
            ## Synthetic-only release

            This release does not validate a physical telescope, camera, atmosphere, adaptive-optics system, or observatory deployment. All benchmark results are simulated ground-truth comparisons.

            ### Install
            ```bash
            python -m pip install waveholo-telescope
            ```

            ### Run benchmark
            ```bash
            waveholo-benchmark --config smoke --output results/smoke
            ```

            ### License
            AGPL-3.0-only.

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/waveholo-telescope
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: waveholo-dist-${{ github.run_id }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          verbose: true

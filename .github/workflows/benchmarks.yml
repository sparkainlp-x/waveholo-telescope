name: Scheduled telescope smoke benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: |
          set +e
          make benchmark CONFIG=benchmarks/configs/telescope_smoke.yaml OUTPUT=/tmp/telescope-smoke
          status=$?
          set -e
          test "$status" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: telescope-smoke-${{ github.run_id }}
          path: /tmp/telescope-smoke
          if-no-files-found: error
